<!DOCTYPE html>
<html>
<head>
    <title>Loan Default Risk Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Loan Default Risk Prediction</h1>

    <p class="subtitle">
        Enter loan and applicant information to estimate default risk.
    </p>

    {% if prediction %}
        <div class="result">
            <h2>Prediction</h2>
            <p>{{ prediction }}</p>
        </div>
    {% endif %}

    <form action="/predict" method="POST">

        <h2>Loan Information</h2>

        <label>Loan Amount</label>
        <input type="number" name="loan_amnt" required>

        <label>Funded Amount</label>
        <input type="number" name="funded_amnt" required>

        <label>Funded Amount Investor</label>
        <input type="number" name="funded_amnt_inv" required>

        <label>Loan Term</label>
        <select name="term">
            <option value="36 months">36 months</option>
            <option value="60 months">60 months</option>
        </select>

        <label>Interest Rate (%)</label>
        <input type="number" step="0.01" name="int_rate">

        <label>Installment</label>
        <input type="number" step="0.01" name="installment">

        <label>Grade</label>
        <select name="grade">
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="E">E</option>
            <option value="F">F</option>
            <option value="G">G</option>
        </select>

        <label>Sub Grade</label>
        <input type="text" name="sub_grade" placeholder="Example: B3">

        <label>Employment Length</label>
        <input type="text" name="emp_length" placeholder="Example: 5 years">

        <label>Home Ownership</label>
        <select name="home_ownership">
            <option value="RENT">Rent</option>
            <option value="OWN">Own</option>
            <option value="MORTGAGE">Mortgage</option>
            <option value="OTHER">Other</option>
        </select>

        <label>Annual Income</label>
        <input type="number" step="0.01" name="annual_inc">

        <label>Verification Status</label>
        <select name="verification_status">
            <option value="Verified">Verified</option>
            <option value="Source Verified">Source Verified</option>
            <option value="Not Verified">Not Verified</option>
        </select>

        <label>Purpose</label>
        <input type="text" name="purpose" placeholder="Example: debt_consolidation">

        <h2>Credit Information</h2>

        <label>Debt-to-Income Ratio</label>
        <input type="number" step="0.01" name="dti">

        <label>Delinquencies in Last 2 Years</label>
        <input type="number" name="delinq_2yrs">

        <label>Credit Inquiries in Last 6 Months</label>
        <input type="number" name="inq_last_6mths">

        <label>Months Since Last Delinquency</label>
        <input type="number" name="mths_since_last_delinq">

        <label>Months Since Last Public Record</label>
        <input type="number" name="mths_since_last_record">

        <label>Open Accounts</label>
        <input type="number" name="open_acc">

        <label>Public Records</label>
        <input type="number" name="pub_rec">

        <label>Revolving Balance</label>
        <input type="number" name="revol_bal">

        <label>Revolving Utilization (%)</label>
        <input type="number" step="0.01" name="revol_util">

        <label>Total Accounts</label>
        <input type="number" name="total_acc">

        <label>Public Record Bankruptcies</label>
        <input type="number" name="pub_rec_bankruptcies">

        <button type="submit">Predict Default Risk</button>

    </form>
{% if prediction %}
<div class="result">
    <h2>Prediction Result</h2>
    <p>{{ prediction }}</p>
</div>
{% endif %}
</div>

</body>
</html>
